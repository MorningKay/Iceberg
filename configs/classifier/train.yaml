train:
  model_name_or_path: hfl/chinese-bert-wwm-ext
  max_length: 256
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  warmup_ratio: 0.0
  logging_steps: 50
  save_steps: 500
  eval_steps: 500
  seed: 42
  fp16: false
  bf16: false
label2id:
  behavior: 0
  coping: 1
  feelings: 2
  feelings about feelings: 3
  perceptions: 4
id2label:
  "0": behavior
  "1": coping
  "2": feelings
  "3": feelings about feelings
  "4": perceptions
